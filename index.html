<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheer Shirakuma</title>
    <!-- นำเข้าฟอนต์ภาษาไทย Kanit จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- นำเข้าไอคอนจาก FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* แก้จาก - เป็น * เพื่อให้รีเซ็ตค่าเริ่มต้นได้ถูกต้อง */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* ปิดแถบไฮไลต์สีฟ้า/เทาเวลาแตะบนมือถือทั้งเว็บ */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background-image: linear-gradient(rgba(10, 15, 35, 0.4), rgba(10, 15, 35, 0.65)), url('images/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        /* คอนเทนต์หลักจัดกึ่งกลางและจำกัดความกว้างไม่ให้ปุ่มยาวเกินไปบนจอใหญ่ */
        .main-container {
            width: 100%;
            max-width: 440px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ส่วนรูปโปรไฟล์ */
        .profile-wrapper {
            margin-bottom: 16px;
        }

        .profile-img {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            background-color: #1e293b;
        }

        /* ชื่อโปรไฟล์ */
        .profile-name {
            font-size: 1.45rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        /* กล่องรวมปุ่มลิงก์ */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* สไตล์ปุ่มแบบกระจกพรีเมียม */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 500;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* ลบเส้นขอบและไฮไลต์แปลกๆ ตอนแตะหรือ focus */
            outline: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ป้องกันไม่ให้เกิดกรอบสี่เหลี่ยมตอนกดบนมือถือ แต่ยังรองรับการกด Tab บนคอม */
        .link-btn:focus {
            outline: none;
        }

        .link-btn:focus-visible {
            outline: 2px solid rgba(125, 211, 252, 0.8);
            outline-offset: 3px;
        }

        /* ไอคอนคมชัดพร้อมวงกลมรองรับ */
        .link-btn i {
            position: absolute;
            left: 20px;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        /* เอฟเฟกต์ตอนเอาเมาส์ชี้ (ทำงานเฉพาะอุปกรณ์ที่มีเมาส์ ไม่ค้างบนมือถือ) */
        @media (hover: hover) {
            .link-btn:hover {
                transform: translateY(-3px);
                background: rgba(255, 255, 255, 0.2);
                border-color: rgba(255, 255, 255, 0.5);
                box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            }

            .link-btn:hover i {
                transform: scale(1.1);
            }
        }

        /* เอฟเฟกต์ตอนนิ้วกดลงไป */
        .link-btn:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.22);
        }

        /* โทนสีพิเศษสำหรับแต่ละปุ่ม */
        .link-btn.donate {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.3), rgba(168, 85, 247, 0.3));
            border-color: rgba(125, 211, 252, 0.4);
        }

        @media (hover: hover) {
            .link-btn.donate:hover {
                background: linear-gradient(135deg, rgba(56, 189, 248, 0.45), rgba(168, 85, 247, 0.45));
                border-color: rgba(186, 230, 253, 0.8);
                box-shadow: 0 10px 25px rgba(168, 85, 247, 0.4);
            }
        }

        .link-btn.donate i {
            color: #7dd3fc;
            background: rgba(56, 189, 248, 0.2);
        }

        .link-btn.ig i {
            color: #f472b6;
            background: rgba(244, 114, 182, 0.2);
        }

        .link-btn.tiktok i {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <main class="main-container">
        <!-- 1. รูปโปรไฟล์ -->
        <div class="profile-wrapper">
            <img src="images/profile.jpg" alt="Cheer Shirakuma" class="profile-img">
        </div>

        <!-- 2. ชื่อ -->
        <h1 class="profile-name">Cheerimizu</h1>

        <!-- 3. ปุ่มช่องทางติดต่อ -->
        <div class="links-wrapper">
            <a href="https://ezdn.app/cheerimizu" target="_blank" rel="noopener noreferrer" class="link-btn donate">
                <i class="fa-solid fa-hand-holding-heart"></i>
                <span>โดเนท | easydonate</span>
            </a>

            <a href="https://www.instagram.com/cheerimizu/" target="_blank" rel="noopener noreferrer" class="link-btn ig">
                <i class="fa-brands fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <a href="https://www.tiktok.com/@cheerimizu" target="_blank" rel="noopener noreferrer" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i>
                <span>TikTok</span>
            </a>
        </div>
    </main>

</body>
</html>
