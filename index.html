              }
            },
            { data: 'name_th' },
            { data: 'name_en' },
            {
              data: 'max_price',
              className: 'text-end',
              render: data => `${data} <img src="https://static.wikia.nocookie.net/hayday/images/f/f0/Coins.png/revision/latest/scale-to-width-down/25?cb=20160223180814" alt="เหรียญ" style="width:14px; height:auto; vertical-align:middle;">`
            },

            },

            }

          dom: '<"top-search d-flex justify-content-center mb-3"f>rt<"bottom d-flex justify-content-between align-items-center mt-3"lip>',
          ordering: false,
          pageLength: 25,

            search: "ค้นหา:",
            lengthMenu: "แสดง _MENU_ รายการต่อหน้า",
            info: "แสดง _START_ ถึง _END_ จากทั้งหมด _TOTAL_ รายการ",
            infoEmpty: "ไม่มีรายการที่ตรงกัน",
            zeroRecords: "ไม่พบข้อมูล",
            paginate: {
              first: "หน้าแรก",
              last: "หน้าสุดท้าย",
              next: "ถัดไป",
              previous: "ก่อนหน้า"
            }
          }
      });
  });

  $(document).on('click', '.btn-add', function () {
    const table = $('#productTable').DataTable();
    const rowData = table.row($(this).closest('tr')).data();

    addLists(rowData);
  });

  // function addLists(product) {
  //   console.log("เพิ่มสินค้า:", product.name_th);
  // }

  let summaryMap = {};

  function addLists(product) {
    const id = product.id;

    if (summaryMap[id]) {
      summaryMap[id].quantity++;
    } else {
      summaryMap[id] = {
        ...product,
        quantity: 1
      };
    }

    renderSummary();
  }

  function renderSummary() {
    const $list = $('#summaryList');
    $list.empty();

    let total = 0;

    Object.values(summaryMap).forEach(item => {
      const subtotal = item.quantity * item.max_price;
      total += subtotal;

      const $row = $(`
        <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap bg-white p-2 rounded border">
          <div class="d-flex align-items-start gap-2 flex-grow-1 flex-wrap">
            <img src="${item.image}" alt="" style="width:32px; height:auto;">
            <div>
              <div>${item.name_th} : ${item.name_en}</div>
              <div class="text-muted small">
                ราคา/ชิ้น: ${item.max_price}
                <img src="https://static.wikia.nocookie.net/hayday/images/f/f0/Coins.png/revision/latest/scale-to-width-down/25?cb=20160223180814" style="width:12px; vertical-align:middle;">
                × <span class="text-danger">${item.quantity}</span>
                = <strong class="text-dark">${subtotal}</strong>
                <img src="https://static.wikia.nocookie.net/hayday/images/f/f0/Coins.png/revision/latest/scale-to-width-down/25?cb=20160223180814" style="width:14px; vertical-align:middle;">
              </div>
            </div>
          </div>

          <div class="btn-group align-self-center mt-2 mt-md-0">
            <button class="btn btn-outline-secondary btn-dec" data-id="${item.id}">
              <i class="fas fa-minus"></i>
            </button>
            <button class="btn btn-outline-secondary btn-inc" data-id="${item.id}">
              <i class="fas fa-plus"></i>
            </button>
          </div>
        </div>
      `);

      $list.append($row);
    });

    $('#totalPrice').text(total);
  }

  // ปุ่มเพิ่ม-ลด
  $(document).on('click', '.btn-inc', function () {
    const id = $(this).data('id');
    summaryMap[id].quantity++;
    renderSummary();
  });

  $(document).on('click', '.btn-dec', function () {
    const id = $(this).data('id');
    if (summaryMap[id].quantity > 1) {
      summaryMap[id].quantity--;
    } else {
      delete summaryMap[id];
    }
    renderSummary();
  });

  // ปุ่มล้าง
  $('#clearSummary').on('click', function () {
    summaryMap = {};
    renderSummary();
  });
</script>
